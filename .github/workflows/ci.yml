name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          LIFEOS_BUILTIN_GOOGLE_ID: ${{ secrets.LIFEOS_BUILTIN_GOOGLE_ID }}
          LIFEOS_BUILTIN_GOOGLE_SECRET: ${{ secrets.LIFEOS_BUILTIN_GOOGLE_SECRET }}
